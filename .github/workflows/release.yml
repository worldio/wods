name: Release

# Publishes to PyPI when a tag is pushed (same flow as sfanxiang/prerun): bump `version` in pyproject.toml,
# commit, then `git tag <version> && git push origin <version>`. Uses PyPI Trusted Publishing -- no API token;
# PyPI must list this repository and workflow file (release.yml) as a trusted publisher for the `wods` project.

on:
  push:
    tags:
      - '*'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Check that the tag matches the package version
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
          echo "::error::Tag ${GITHUB_REF_NAME} does not match version ${version} in pyproject.toml"
          exit 1
        fi
    - name: Install build dependencies
      run: python -m pip install -U build
    - name: Build
      run: python -m build .
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        skip-existing: true
